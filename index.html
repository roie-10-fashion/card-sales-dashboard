<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0912">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rocea Cards">
<title>Rocea Cards Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0912;
    --bg-2: #100e1c;
    --surface: #16132399;
    --surface-solid: #161323;
    --surface-2: #1e1a30;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #f5f4fb;
    --text-secondary: #a9a4c4;
    --muted: #726d8e;
    --grid: rgba(255,255,255,0.07);

    --good: #34d399;
    --critical: #f87171;
    --warning: #fbbf24;

    --identity: #818cf8; --identity-tint: rgba(129,140,248,0.14);
    --pop:      #d946ef; --pop-tint: rgba(217,70,239,0.14);
    --purchase: #60a5fa; --purchase-tint: rgba(96,165,250,0.14);
    --listing:  #c084fc; --listing-tint: rgba(192,132,252,0.14);
    --sale:     #34d399; --sale-tint: rgba(52,211,153,0.14);
    --turq:     #2ee8d4; --turq-tint: rgba(46,232,212,0.12);
    --fees:     #fbbf24; --fees-tint: rgba(251,191,36,0.14);
    --review:   #f87171; --review-tint: rgba(248,113,113,0.14);

    --s1: #3987e5; --s2: #d95926; --s3: #199e70;

    --font-display: 'Sora', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- hero ---------------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 46px 20px 64px;
    text-align: center;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .hero .brand-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 auto 18px;
  }
  .hero .mascot {
    height: 58px;
    width: auto;
    pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    transform-origin: 50% 100%;
    animation: mascotWobble 3.2s ease-in-out infinite;
  }
  @keyframes mascotWobble {
    0%, 100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg); }
  }
  @media (max-width: 560px) {
    .hero .mascot { height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero .mascot { animation: none; }
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    pointer-events: none;
  }
  .hero::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #7c3aed, transparent 70%);
    top: -180px; left: 8%;
  }
  .hero::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #f59e0b, transparent 70%);
    top: -140px; right: 6%;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero .brand-logo {
    display: block;
    height: 130px;
    width: auto;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.45));
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 800;
    margin: 0 0 8px;
    font-size: clamp(30px, 5.2vw, 46px);
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, #f59e0b, #ec4899, #8b5cf6, #3b82f6, #f59e0b);
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 9s linear infinite;
  }
  @keyframes shine { to { background-position: 250% center; } }
  @media (prefers-reduced-motion: reduce) { .hero h1 { animation: none; } }
  .hero .sub { color: var(--text-secondary); font-size: 15px; }
  .hero .updated { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .install-btn {
    margin-top: 14px; border: 1px solid var(--border-strong); border-radius: 999px;
    background: linear-gradient(100deg, rgba(245,158,11,.18), rgba(139,92,246,.22));
    color: var(--text-primary); font-family: var(--font-body); font-size: 13px; font-weight: 600;
    padding: 10px 18px; cursor: pointer; min-height: 40px;
  }
  .install-btn[hidden] { display: none; }

  .wrap { max-width: 1680px; margin: 0 auto; padding: 0 20px; }

  /* ---------------- stat tiles ---------------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-top: -34px;
    position: relative; z-index: 2;
  }
  .stat-tile {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent, var(--identity));
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 12px 28px rgba(0,0,0,.35);
  }
  .stat-tile .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .stat-tile .value { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-top: 6px; color: var(--text-primary); }
  .stat-tile.good { --accent: var(--good); } .stat-tile.good .value { color: var(--good); }
  .stat-tile.critical { --accent: var(--critical); } .stat-tile.critical .value { color: var(--critical); }
  .stat-tile.warn { --accent: var(--warning); } .stat-tile.warn .value { color: var(--warning); }

  section { margin-top: 34px; }
  h2 {
    font-family: var(--font-display);
    font-size: 17px;
    margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
    font-weight: 700;
  }

  /* ---------------- charts ---------------- */
  .charts { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (max-width: 780px) { .charts { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .chart-card .title { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; font-weight: 600; }
  .hbar-row { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
  .hbar-row .lbl { width: 84px; font-size: 12.5px; color: var(--text-secondary); flex-shrink: 0; }
  .hbar-row svg { flex: 1; height: 22px; overflow: visible; }
  .hbar-row .val { width: 92px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .donut-center-label { font-family: var(--font-display); font-size: 26px; font-weight: 800; fill: var(--text-primary); }
  .donut-center-sub { font-size: 10.5px; fill: var(--muted); }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #1e1a30;
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 8px;
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
    z-index: 999;
    opacity: 0;
    transition: opacity .1s;
    white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }

  /* ---------------- lightbox (click a card photo to zoom) ---------------- */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(6,5,12,.92);
    display: none; align-items: center; justify-content: center;
    padding: 32px; cursor: zoom-out;
  }
  .lightbox-overlay.show { display: flex; flex-direction: column; gap: 14px; }
  .lb-track {
    width: min(92vw, 720px); height: 82vh;
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .lb-track::-webkit-scrollbar { display: none; }
  .lb-slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-overlay .lb-slide img {
    max-width: 100%; max-height: 100%; cursor: default;
    border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.6);
    border: 1px solid var(--border-strong);
  }
  .lightbox-overlay.single .lb-track { overflow-x: hidden; }
  .lightbox-overlay.single #lbBackSlide,
  .lightbox-overlay.single .lb-dots,
  .lightbox-overlay.single .lb-nav { display: none; }
  .lb-dots { display: flex; gap: 8px; }
  .lb-dots button {
    border: 1px solid var(--border-strong); background: rgba(255,255,255,.06);
    color: var(--text-secondary); font: 600 12px var(--font-body);
    padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }
  .lb-dots button.active { background: var(--turq, #2ee8d4); color: #0d0b16; border-color: transparent; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: rgba(20,18,32,.75);
    color: var(--text-primary); font-size: 30px; line-height: 1; cursor: pointer;
  }
  .lb-nav:hover { background: rgba(46,232,212,.25); }
  .lb-prev { left: max(16px, calc(50% - 420px)); }
  .lb-next { right: max(16px, calc(50% - 420px)); }
  .lb-nav[disabled] { opacity: .25; cursor: default; }
  .lightbox-close {
    position: absolute; top: 18px; right: 24px;
    color: var(--text-primary); font-size: 30px; line-height: 1;
    background: none; border: none; cursor: pointer; opacity: .8;
  }
  .lightbox-close:hover { opacity: 1; }
  .card-tile .img-wrap img { cursor: zoom-in; }
  .thumb { cursor: zoom-in; }

  /* ---------------- toolbar / toggle ---------------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .toolbar input[type=text] {
    flex: 1; min-width: 180px; max-width: 420px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-solid); color: var(--text-primary); font-size: 14px; font-family: var(--font-body);
  }
  .toolbar input::placeholder { color: var(--muted); }
  .toolbar select {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-solid); color: var(--text-primary); font-size: 13px; font-family: var(--font-body);
  }
  .view-toggle { display: flex; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
  .view-toggle button {
    border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-family: var(--font-body);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .view-toggle button.active { background: var(--listing); color: #1a0f2e; }

  /* ---------------- card grid ---------------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .card-tile {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-tile:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: 0 18px 34px rgba(0,0,0,.45); }
  .card-tile .img-wrap {
    aspect-ratio: 3/4;
    position: relative;
    background:
      repeating-linear-gradient(135deg, var(--identity-tint) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, #1c1830, #120f1e);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card-tile .img-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .card-tile .img-wrap .placeholder { font-size: 36px; opacity: .5; filter: grayscale(.2); }
  .card-tile .body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .card-tile .name { font-size: 13.5px; font-weight: 700; line-height: 1.3; font-family: var(--font-display); }
  .card-tile .meta { font-size: 11px; color: var(--text-secondary); }
  .card-tile .meta.pop-meta { white-space: pre-line; line-height: 1.45; }
  .pop-meta strong, .col-pop strong { color: var(--pop); font-weight: 700; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; font-weight: 700; }
  .badge.sold { background: var(--sale-tint); color: var(--sale); }
  .badge.listed { background: var(--listing-tint); color: var(--listing); }
  .badge.unlisted { background: rgba(255,255,255,.06); color: var(--text-secondary); }
  .card-tile .profit { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-tile .profit.good { color: var(--good); }
  .card-tile .profit.bad { color: var(--critical); }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .empty-note { padding: 22px; text-align: center; color: var(--text-secondary); font-size: 13px; background: var(--surface-solid); border-radius: 14px; border: 1px dashed var(--border); }

  /* ---------------- full data table ---------------- */
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface-solid);
  }
  .data-table { min-width: 1020px; }
  .data-table th {
    position: sticky; top: 0;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em;
    text-align: left; padding: 9px 10px; white-space: nowrap;
    color: #0d0b16; font-weight: 700;
  }
  .data-table td { padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .data-table td.details-cell { white-space: normal; min-width: 195px; font-variant-numeric: normal; }
  .data-table tbody tr:hover { background: rgba(255,255,255,.03); }
  .grp-identity { background: var(--identity); } .grp-identity-bg td { background: var(--identity-tint); }
  .grp-pop { background: var(--pop); }
  .grp-purchase { background: var(--purchase); }
  .grp-listing { background: var(--listing); }
  .grp-sale { background: var(--sale); }
  .grp-fees { background: var(--fees); }
  .grp-turq { background: var(--turq); }
  .col-identity { background: rgba(129,140,248,.05); }
  .col-pop { background: rgba(217,70,239,.07); }
  .data-table td.col-pop {
    white-space: normal;
    min-width: 120px;
    text-align: left;
    vertical-align: middle;
  }
  .col-purchase { background: rgba(96,165,250,.05); }
  .col-listing { background: rgba(192,132,252,.05); }
  .col-sale { background: rgba(52,211,153,.05); }
  .col-fees { background: rgba(251,191,36,.05); }
  .data-table td.col-turq { background: var(--turq-tint); color: var(--turq); font-weight: 700; }
  .badge.pop { background: var(--pop-tint); color: var(--pop); }
  .pos { color: var(--good); font-weight: 700; }
  .neg { color: var(--critical); font-weight: 700; }
  .thumb { width: 68px; height: 88px; border-radius: 6px; object-fit: contain; vertical-align: middle; background: var(--surface-2); }

  .data-table td.col-pop .pop-short { display: none; }
  .data-table td.col-pop .pop-full { display: block; white-space: pre-line; line-height: 1.5; font-size: 12px; }

  footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 44px; }

  /* ================= PHONE / ANDROID LAYOUT =================
     Same page, same URL - it just re-arranges itself on small screens. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 700px) {
    body { padding-bottom: 30px; }
    .hero { padding: 26px 14px 52px; }
    .hero .brand-logo { height: 96px; }
    .hero .mascot { height: 44px; }
    .hero .brand-row { margin-bottom: 12px; }
    .hero h1 { font-size: clamp(21px, 6.4vw, 30px); white-space: nowrap; }
    .hero .sub { font-size: 13px; padding: 0 6px; }
    .hero .updated { font-size: 11px; margin-top: 10px; }
    .wrap { padding: 0 12px; }

    .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: -30px; }
    .stat-tile { padding: 12px 13px; }
    .stat-tile .label { font-size: 10px; }
    .stat-tile .value { font-size: 19px; margin-top: 4px; }

    section { margin-top: 26px; }
    h2 { font-size: 16px; margin-bottom: 10px; }
    .chart-card { padding: 14px; border-radius: 14px; }

    .toolbar { gap: 8px; }
    .toolbar input[type=text] { flex: 1 1 100%; max-width: none; min-width: 0; font-size: 16px; padding: 11px 13px; }
    .toolbar select { flex: 1; font-size: 14px; padding: 11px 10px; min-height: 44px; }
    .view-toggle { flex: 1; }
    .view-toggle button { flex: 1; padding: 10px 8px; font-size: 13px; min-height: 40px; }

    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card-tile { border-radius: 13px; }
    .card-tile:hover { transform: none; box-shadow: none; }
    .card-tile .body { padding: 10px 10px 12px; gap: 5px; }
    .card-tile .name { font-size: 12.5px; }
    .card-tile .meta { font-size: 10.5px; }
    .card-tile .profit { font-size: 12px; }

    /* Table view -> one stacked "card" per row, no sideways scrolling */
    .table-scroll { overflow: visible; border: none; background: transparent; border-radius: 0; }
    .data-table { min-width: 0; display: block; font-size: 13px; }
    .data-table thead { display: none; }
    .data-table tbody { display: block; }
    .data-table tr {
      display: block; margin-bottom: 12px; padding: 4px 0 6px;
      background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    .data-table tbody tr:hover { background: var(--surface-solid); }
    .data-table td {
      display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
      padding: 7px 14px; border-bottom: 1px solid var(--grid); background: transparent !important;
      white-space: normal; text-align: right;
    }
    .data-table td:last-child { border-bottom: none; }
    .data-table td::before {
      content: attr(data-label); flex: none; color: var(--text-secondary);
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; text-align: left;
    }
    .data-table td.is-empty { display: none; }
    .data-table td.col-turq { color: var(--turq); font-weight: 700; }
    .data-table td.col-turq::before { color: var(--turq); }
    .data-table td.cell-photo { justify-content: center; padding: 14px 14px 6px; border-bottom: none; }
    .data-table td.cell-photo::before { display: none; }
    .data-table td.cell-photo .thumb { width: 120px; height: 160px; }
    .data-table td.details-cell { display: block; text-align: left; min-width: 0; padding: 4px 14px 10px; }
    .data-table td.details-cell::before { display: none; }
    .data-table td.col-pop { display: block; max-width: none; min-width: 0; overflow: visible; text-overflow: clip; cursor: default; text-align: left; }
    .data-table td.col-pop::before { display: block; margin-bottom: 4px; }
    .data-table td.col-pop .pop-short { display: none; }
    .data-table td.col-pop .pop-full { display: block; white-space: pre-line; line-height: 1.5; font-size: 12px; }

    .lightbox-overlay { padding: 14px 0; }
    .lb-track { width: 100vw; height: 78vh; }
    .lb-slide { padding: 0 12px; }
    .lb-nav { display: none; }
    .lightbox-close { top: 8px; right: 12px; font-size: 38px; padding: 6px 10px; }
    footer { margin-top: 28px; }
  }
  @media (max-width: 360px) {
    .stat-tile .value { font-size: 17px; }
    .grid { gap: 8px; }
  }
</style>
</head>
<body>

<div class="hero">

const D = window.CARD_DATA;
const fmt = (n) => {
  if (n === null || n === undefined || n === "") return "—";
  const num = Number(n);
  const sign = num < 0 ? "-" : "";
  return sign + "¥" + Math.abs(num).toLocaleString(undefined, {maximumFractionDigits: 0});
};
const fmtPlain = (n) => (n === null || n === undefined || n === "") ? "—" : Number(n).toLocaleString(undefined, {maximumFractionDigits: 0});

document.getElementById('updatedAt').textContent = 'Last updated ' + new Date(D.generated_at).toLocaleString();

const s = D.stats;
const profitClass = s.total_net_profit_rmb > 0 ? 'good' : (s.total_net_profit_rmb < 0 ? 'critical' : '');
// Outstanding investment = Invested (shown as a negative expense) + Total amount sold
const outstanding = -s.total_invested_rmb + s.total_actual_rmb;
const tiles = [
  ['Total cards', s.total_cards, ''],
  ['Total cards sold', s.sold_count, ''],
  ['Total amount sold', fmt(s.total_actual_rmb), 'good'],
  ['Invested', fmt(-s.total_invested_rmb), 'warn'],
  ['Net profit', fmt(s.total_net_profit_rmb), profitClass],
  ['Outstanding investment', fmt(outstanding), outstanding >= 0 ? 'good' : 'warn'],
];
document.getElementById('statsRow').innerHTML = tiles.map(([label, value, cls]) =>
  `<div class="stat-tile ${cls}"><div class="label">${label}</div><div class="value">${value}</div></div>`
).join('');

// ---------------- tooltip helper ----------------
const tipEl = document.getElementById('tooltip');
function showTip(evt, html) {
  tipEl.innerHTML = html;
  tipEl.classList.add('show');
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}
function hideTip() { tipEl.classList.remove('show'); }

// ---------------- SVG horizontal bar chart ----------------
function renderHBarChart(containerId, rows) {
  const max = Math.max(1, ...rows.map(r => Math.abs(r.value || 0)));
  const el = document.getElementById(containerId);
  el.innerHTML = rows.map((r, i) => {
    const pct = Math.max(1.5, Math.abs(r.value || 0) / max * 100);
    const barId = containerId + '-bar-' + i;
    return `<div class="hbar-row">
      <div class="lbl">${r.label}</div>
      <svg viewBox="0 0 100 22" preserveAspectRatio="none">
        <rect x="0" y="7" width="100" height="8" rx="4" fill="var(--grid)"></rect>
        <rect id="${barId}" x="0" y="7" width="${pct}" height="8" rx="4" fill="${r.color}" style="cursor:pointer"></rect>
      </svg>
      <div class="val">${fmt(r.value)}</div>
    </div>`;
  }).join('');
  rows.forEach((r, i) => {
    const bar = document.getElementById(containerId + '-bar-' + i);
    bar.addEventListener('mousemove', (e) => showTip(e, `<strong>${r.label}</strong><br>${fmt(r.value)}`));
    bar.addEventListener('mouseleave', hideTip);
  });
}

// ---------------- donut status chart ----------------
(function () {
  const rows = [
    { label: 'Sold', value: s.sold_count, color: 'var(--s3)' },
    { label: 'Listed', value: s.listed_count, color: 'var(--s1)' },
    { label: 'Not listed', value: s.unlisted_count, color: 'var(--muted)' },
  ];
  const total = Math.max(1, rows.reduce((a, r) => a + (r.value || 0), 0));
  const R = 52, C = 2 * Math.PI * R, CX = 70, CY = 70;
  let offset = 0;
  const arcs = rows.map((r, i) => {
    const frac = (r.value || 0) / total;
    const len = frac * C;
    const gap = rows.filter(x => x.value > 0).length > 1 ? 3 : 0;
    const dash = `${Math.max(0, len - gap)} ${C - Math.max(0, len - gap)}`;
    const el = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${r.color}" stroke-width="16"
      stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" stroke-linecap="round" data-i="${i}" style="cursor:pointer"></circle>`;
    offset += len;
    return el;
  }).join('');
  const totalCount = s.total_cards;
  const svg = `<svg viewBox="0 0 140 140" width="180" height="180" style="transform:rotate(-90deg)">
      ${arcs}
    </svg>`;
  const legendHtml = rows.map(r => `<span><i style="background:${r.color}"></i>${r.label}: ${r.value}</span>`).join('');
  document.getElementById('statusChart').innerHTML = `
    <div class="donut-wrap">
      <div style="position:relative;width:180px;height:180px;">
        ${svg}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="font-family:var(--font-display);font-size:26px;font-weight:800;">${totalCount}</div>
          <div style="font-size:10.5px;color:var(--muted);">cards</div>
        </div>
      </div>
      <div class="legend" style="margin-top:0;flex-direction:column;align-items:flex-start;">${legendHtml}</div>
    </div>`;
  document.querySelectorAll('#statusChart circle').forEach((c) => {
    const r = rows[Number(c.dataset.i)];
    c.addEventListener('mousemove', (e) => showTip(e, `<strong>${r.label}</strong><br>${r.value} card(s)`));
    c.addEventListener('mouseleave', hideTip);
  });
})();

// ---------------- shared helpers ----------------
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function statusBadge(c) {
  if (c.status === 'sold') return '<span class="badge sold">Sold</span>';
  if (c.status === 'listed') return '<span class="badge listed">Listed</span>';
  return '<span class="badge unlisted">Not listed</span>';
}
function cardTile(c) {
  const img = c.image
    ? `<img class="zoomable" data-card-id="${c.id}" src="${c.image}" alt="${escapeHtml(c.name)}" loading="lazy">`
    : `<div class="placeholder">🃏</div>`;
  let profitHtml = '';
  if (c.net_profit_rmb !== null && c.net_profit_rmb !== undefined) {
    const cls = c.net_profit_rmb >= 0 ? 'good' : 'bad';
    const pctStr = (c.profit_pct !== null && c.profit_pct !== undefined)
      ? ` (${c.profit_pct >= 0 ? '+' : ''}${Number(c.profit_pct).toFixed(1)}%)` : '';
    profitHtml = `<div class="profit ${cls}">${c.net_profit_rmb >= 0 ? '+' : ''}${fmt(c.net_profit_rmb)}${pctStr}</div>`;
  }
  const popHtml = c.pop_report_html ? `<div class="meta pop-meta">POP: ${c.pop_report_html}</div>` : '';
  const serialHtml = c.serial_number ? `<div class="meta">Serial: ${escapeHtml(c.serial_number)}</div>` : '';
  return `<div class="card-tile" data-name="${escapeHtml((c.name + ' ' + (c.meta||'')).toLowerCase())}" data-status="${c.status}">
    <div class="img-wrap">${img}</div>
    <div class="body">
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="meta">${escapeHtml(c.meta || '')}</div>
      ${serialHtml}
      ${popHtml}
      <div class="meta">Purchase: ${fmt(c.purchase_price_rmb)}</div>
      <div class="meta">Sold For: ${fmt(c.actual_sale_rmb)}</div>
      ${profitHtml}
      <div class="badges">
        ${statusBadge(c)}
      </div>
    </div>
  </div>`;
}

function popSummary(c) {
  if (!c.pop_report) return null;
  const firstLine = c.pop_report.split('\n').map(s => s.trim()).find(s => s.length > 0);
  return firstLine || null;
}

function dataTableRow(c) {
  const profitCls = c.net_profit_rmb > 0 ? 'pos' : (c.net_profit_rmb < 0 ? 'neg' : '');
  const popShort = popSummary(c);
  const popTitle = c.pop_report ? ` title="${escapeHtml(c.pop_report.trim())}"` : '';
  const popFull = c.pop_report_html ? c.pop_report_html.trim() : '';
  const popCell = popShort
    ? `<span class="pop-short">${escapeHtml(popShort)}</span><span class="pop-full">${popFull}</span>`
    : '—';
  return `<tr data-name="${escapeHtml((c.name + ' ' + (c.meta||'')).toLowerCase())}" data-status="${c.status}">
    <td class="col-identity cell-photo">${c.image ? `<img class="thumb zoomable" data-card-id="${c.id}" src="${c.image}">` : '🃏'}</td>
    <td class="col-identity details-cell"><strong>${escapeHtml(c.name)}</strong><br><span style="color:var(--text-secondary);font-size:11.5px;">${escapeHtml(c.meta||'')}</span></td>
    <td class="col-identity" data-label="Serial #">${c.serial_number ? escapeHtml(c.serial_number) : '—'}</td>
    <td class="col-pop" data-label="POP Report"${popTitle}>${popCell}</td>
    <td class="col-purchase col-turq" data-label="Purchase ¥">${fmt(c.purchase_price_rmb)}</td>
    <td class="col-purchase" data-label="Purchase Date">${c.purchase_date || '—'}</td>
    <td class="col-listing" data-label="Status">${c.status_text ? escapeHtml(c.status_text) : '—'}</td>
    <td class="col-sale col-turq" data-label="Sale ¥">${fmt(c.actual_sale_rmb)}</td>
    <td class="col-sale" data-label="Sale Date">${c.sale_date || '—'}</td>
    <td class="col-sale" data-label="Platform">${c.platform ? escapeHtml(c.platform) : '—'}</td>
    <td class="col-fees ${profitCls}" data-label="Net Profit ¥">${fmt(c.net_profit_rmb)}</td>
    <td class="col-fees ${profitCls}" data-label="Profit %">${c.profit_pct !== null && c.profit_pct !== undefined ? Number(c.profit_pct).toFixed(1) + '%' : '—'}</td>
  </tr>`;
}

const TABLE_HEADERS = [
  ['grp-identity', 'Image'], ['grp-identity', 'Card Details'], ['grp-identity', 'Serial #'],
  ['grp-pop', 'POP Report'],
  ['grp-turq', 'Purchase ¥'], ['grp-purchase', 'Purchase Date'],
  ['grp-listing', 'Status'],
  ['grp-turq', 'Sale ¥'], ['grp-sale', 'Sale Date'], ['grp-sale', 'Platform'],
  ['grp-fees', 'Net Profit ¥'], ['grp-fees', 'Profit %'],
];

function renderTableHead() {
  const table = document.getElementById('dataTable');
  const thead = '<thead><tr>' + TABLE_HEADERS.map(([cls, label]) => `<th class="${cls}">${label}</th>`).join('') + '</tr></thead>';
  table.innerHTML = thead + '<tbody id="dataTableBody"></tbody>';
}
renderTableHead();

// ---------------- filtering / view toggle ----------------
const gridEl = document.getElementById('cardGrid');
const tableWrap = document.getElementById('tableWrap');
const emptyNote = document.getElementById('emptyNote');
let currentView = 'cards';

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  return D.cards.filter(c => {
    if (q && !((c.name + ' ' + (c.meta||'') + ' ' + (c.serial_number||'')).toLowerCase().includes(q))) return false;
    if (statusF && c.status !== statusF) return false;
    return true;
  });
}
function renderView() {
  const filtered = getFiltered();
  emptyNote.style.display = filtered.length === 0 ? 'block' : 'none';
  if (currentView === 'cards') {
    gridEl.style.display = filtered.length ? 'grid' : 'none';
    tableWrap.style.display = 'none';
    gridEl.innerHTML = filtered.map(cardTile).join('');
  } else {
    gridEl.style.display = 'none';
    tableWrap.style.display = filtered.length ? 'block' : 'none';
    document.getElementById('dataTableBody').innerHTML = filtered.map(dataTableRow).join('');
    document.querySelectorAll('#dataTableBody td').forEach(td => { if (td.textContent.trim() === '—') td.classList.add('is-empty'); });
  }
}
document.getElementById('searchBox').addEventListener('input', renderView);
document.getElementById('statusFilter').addEventListener('change', renderView);
document.getElementById('btnViewCards').addEventListener('click', () => {
  currentView = 'cards';
  document.getElementById('btnViewCards').classList.add('active');
  document.getElementById('btnViewTable').classList.remove('active');
  renderView();
});
document.getElementById('btnViewTable').addEventListener('click', () => {
  currentView = 'table';
  document.getElementById('btnViewTable').classList.add('active');
  document.getElementById('btnViewCards').classList.remove('active');
  renderView();
});
renderView();

// ---------------- lightbox (click a card photo to zoom) ----------------
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
const lbTrack = document.getElementById('lbTrack');
const lightboxImgBack = document.getElementById('lightboxImgBack');
const lbDots = document.querySelectorAll('#lbDots button');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
function lbIndex() { return Math.round(lbTrack.scrollLeft / Math.max(1, lbTrack.clientWidth)); }
function lbGo(i) { lbTrack.scrollTo({ left: i * lbTrack.clientWidth, behavior: 'smooth' }); }
function lbSync() {
  const i = lbIndex();
  lbDots.forEach((b, k) => b.classList.toggle('active', k === i));
  lbPrev.disabled = i === 0; lbNext.disabled = i === 1;
}
lbTrack.addEventListener('scroll', lbSync, { passive: true });
lbDots.forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); lbGo(+b.dataset.i); }));
lbPrev.addEventListener('click', (e) => { e.stopPropagation(); lbGo(0); });
lbNext.addEventListener('click', (e) => { e.stopPropagation(); lbGo(1); });
function openLightbox(src, backSrc) {
  lightboxImg.src = src;
  lightboxImgBack.src = backSrc || '';
  lightboxOverlay.classList.toggle('single', !backSrc);
  lightboxOverlay.classList.add('show');
  lbTrack.style.scrollBehavior = 'auto'; lbTrack.scrollLeft = 0; lbTrack.style.scrollBehavior = '';
  lbSync();
  // add a history step so the phone's Back button closes the photo
  if (!(history.state && history.state.lightbox)) history.pushState({ lightbox: true }, '');
}
function hideLightbox() {
  lightboxOverlay.classList.remove('show');
  lightboxImg.src = '';
  lightboxImgBack.src = '';
}
function closeLightbox() {
  if (!lightboxOverlay.classList.contains('show')) return;
  if (history.state && history.state.lightbox) history.back();  // popstate hides it
  else hideLightbox();
}
window.addEventListener('popstate', () => {
  if (lightboxOverlay.classList.contains('show')) hideLightbox();
});
document.addEventListener('click', (e) => {
  const img = e.target.closest('img.zoomable');
  if (img && !lightboxOverlay.contains(img)) {
    const card = img.dataset.cardId ? D.cards.find(x => x.id === img.dataset.cardId) : null;
    openLightbox(img.src, card ? card.image_back : null);
    return;
  }
  if (e.target === lightboxOverlay || e.target.classList.contains('lb-slide')) closeLightbox();
});
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
  if (lightboxOverlay.classList.contains('show') && !lightboxOverlay.classList.contains('single')) {
    if (e.key === 'ArrowRight') lbGo(1);
    if (e.key === 'ArrowLeft') lbGo(0);
  }
});

// ---------------- phone app (installable PWA) ----------------
(function () {
  const installBtn = document.getElementById('installBtn');
  let deferredPrompt = null;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) installBtn.hidden = false;
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null;
    installBtn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { installBtn.hidden = true; });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // When you come back to the app after a while, pull the newest data.
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); }
    else if (hiddenAt && Date.now() - hiddenAt > 120000) { location.reload(); }
  });
})();
</script>
